; A KNOWN-GOOD ESP32 TRANSMITTER, for validating nat-os's receiver.
;
; This is the only thing in the repository that uses somebody else's build
; system, and it is here deliberately. nat-os's WiFi transmit does not reach
; the air (UM-NATOS-034), and every measurement of that has been made with a
; receiver whose only proven reference was a router across the house.
;
; This gives the receiver a transmitter we CONTROL: known MAC, known SSID,
; known channel, 30 cm away, running Espressif's own stack. If nat-os hears it,
; the receive rig is validated against a definitely-working transmitter for the
; first time -- and the same firmware is then the reference for a register-level
; diff against nat-os's failing transmit path.
;
; It never runs on the nat-os board. COM6 only.

[env:cyd_reference]
platform = espressif32
board = esp32dev
framework = espidf
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
